# Reusable workflow called from student repositories (see
# template/.github/workflows/codementor.yml). The workflow picks the agent mode
# (PLAN.md, section 3):
#
# - job `check` (pull_request): starts the student's service, runs the protected
#   tests of the ticket taken from the branch name and posts one PR comment.
#   Tests failed -> the mentor agent in debugging mode writes a hint.
#   Tests passed -> the agent in review mode asks two questions about the fix.
#   If the agent fails, the plain result is posted.
# - job `answer` (issue_comment by the PR author): the agent judges the answers
#   to the review questions; for `done` this workflow adds `ticket-N-done`.
#
# The agent never gets a GitHub token: it writes comment.md (and verdict.txt),
# and this workflow posts them (DECISIONS.md, D14, D28).

name: CodeMentor check

on:
  workflow_call:
    inputs:
      platform_repo:
        description: Repository with the protected tests
        type: string
        default: aruzhanusserbai/code-mentor
      platform_ref:
        description: Branch or tag of the platform repository to take tests from
        type: string
        default: main

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: codementor-${{ github.repository }}-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Detect ticket from branch name
        id: ticket
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$BRANCH" =~ ^ticket-([0-9]+)-[a-z0-9-]+$ ]]; then
            echo "number=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "Ticket ${BASH_REMATCH[1]} (branch $BRANCH)"
          else
            message="Branch '$BRANCH' does not follow the rule ticket-<N>-<description>, for example ticket-1-empty-cart. Rename the branch and open the PR again."
            echo "::error::$message"
            echo "### CodeMentor: branch name not recognized" >> "$GITHUB_STEP_SUMMARY"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Check out student repository
        uses: actions/checkout@v4
        with:
          path: student
          fetch-depth: 0  # the base branch is needed for the diff in review mode

      - name: Check out platform tests
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.platform_repo }}
          ref: ${{ inputs.platform_ref }}
          path: codementor

      - name: Check that tests exist for this ticket
        env:
          TICKET: ${{ steps.ticket.outputs.number }}
        run: |
          if [ ! -d "codementor/tests/tickets/ticket_${TICKET}" ]; then
            message="There are no tests for ticket ${TICKET}. Check the ticket number in the branch name."
            echo "::error::$message"
            echo "### CodeMentor: unknown ticket" >> "$GITHUB_STEP_SUMMARY"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Start the service
        id: service
        working-directory: student
        continue-on-error: true
        run: docker compose up -d --build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r codementor/tests/requirements.txt

      - name: Run ticket tests
        id: tests
        if: steps.service.outcome == 'success'
        env:
          TICKET: ${{ steps.ticket.outputs.number }}
          CODEMENTOR_BASE_URL: http://localhost:8080
        run: |
          set +e
          python -m pytest "codementor/tests/tickets/ticket_${TICKET}" -v --tb=short -p no:cacheprovider 2>&1 | tee test-output.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -eq 0 ]; then
            echo "result=passed" >> "$GITHUB_OUTPUT"
          else
            echo "result=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide result
        id: result
        env:
          SERVICE_OUTCOME: ${{ steps.service.outcome }}
          TEST_RESULT: ${{ steps.tests.outputs.result }}
        run: |
          if [ "$SERVICE_OUTCOME" != "success" ]; then
            echo "value=build_failed" >> "$GITHUB_OUTPUT"
          else
            echo "value=$TEST_RESULT" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect service logs
        # Only if we tried to start the service (not when the branch name was rejected).
        if: always() && (steps.service.outcome == 'success' || steps.service.outcome == 'failure')
        working-directory: student
        run: docker compose logs --no-color > ../service.log 2>&1 || true

      # Hint level = earlier hints of the bot for this ticket + 1, at most 3 (D17).
      # This step has the token, the agent does not. If the comments cannot be
      # read, use level 1: err towards less help, never more (D21).
      - name: Pick hint level
        id: level
        if: steps.result.outputs.value == 'failed'
        working-directory: codementor
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TICKET: ${{ steps.ticket.outputs.number }}
        run: |
          level=1
          if gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" > ../pr-comments.json \
            && picked=$(python -m agent.levels --ticket "$TICKET" --comments ../pr-comments.json); then
            case "$picked" in
              1|2|3) level=$picked ;;
              *) echo "::warning title=CodeMentor::Unexpected hint level '$picked', using level 1." ;;
            esac
          else
            echo "::warning title=CodeMentor::Could not read earlier PR comments, using hint level 1."
          fi
          echo "Hint level: $level"
          echo "value=$level" >> "$GITHUB_OUTPUT"

      # Review mode needs the student's change. The checkout is the PR merge
      # commit, so base...HEAD is exactly what the PR changes.
      - name: Collect the student's change
        if: steps.result.outputs.value == 'passed'
        working-directory: student
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff "origin/${BASE_REF}...HEAD" > ../changes.diff

      # Tests failed -> debugging; passed -> review, unless the ticket is already
      # done (the label is in the event payload, no API call).
      # The agent only reads: it gets no GitHub token and writes comment.md,
      # which the next step posts (DECISIONS.md, D14).
      - name: Run the mentor agent
        id: agent
        if: >-
          steps.result.outputs.value == 'failed'
          || (steps.result.outputs.value == 'passed'
              && !contains(github.event.pull_request.labels.*.name, format('ticket-{0}-done', steps.ticket.outputs.number)))
        continue-on-error: true
        working-directory: codementor
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CODEMENTOR_MODEL: ${{ vars.CODEMENTOR_MODEL }}
          CODEMENTOR_BASE_URL: http://localhost:8080
          TICKET: ${{ steps.ticket.outputs.number }}
          RESULT: ${{ steps.result.outputs.value }}
          LEVEL: ${{ steps.level.outputs.value || '1' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          pip install -r agent/requirements.txt
          if [ "$RESULT" = "failed" ]; then
            python -m agent.main --ticket "$TICKET" --level "$LEVEL" --repo ../student \
              --test-output ../test-output.txt --log ../service.log \
              --out ../comment.md --trace ../agent-trace.json --run-url "$RUN_URL"
          else
            python -m agent.main --mode review --ticket "$TICKET" --repo ../student \
              --diff ../changes.diff --head-sha "$HEAD_SHA" \
              --out ../comment.md --trace ../agent-trace.json --run-url "$RUN_URL"
          fi

      - name: Upload test output and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codementor-run
          path: |
            test-output.txt
            service.log
            changes.diff
            agent-trace.json
          if-no-files-found: ignore

      # One new comment per run. The agent comment has mode=debugging or
      # mode=review; the plain result comment (build failed, the agent failed or
      # was skipped) has mode=check, so it never counts as a hint level or a review.
      - name: Comment on the pull request
        if: steps.result.outputs.value != ''
        env:
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TICKET: ${{ steps.ticket.outputs.number }}
          RESULT: ${{ steps.result.outputs.value }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$AGENT_OUTCOME" = "success" ] && [ -s comment.md ]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment.md
            exit 0
          fi
          case "$RESULT" in
            passed) headline="All ticket ${TICKET} tests passed." ;;
            failed) headline="Some ticket ${TICKET} tests failed." ;;
            *)      headline="The service did not build or start, so the tests did not run." ;;
          esac
          {
            echo "<!-- codementor:ticket=${TICKET};mode=check;result=${RESULT} -->"
            echo "### CodeMentor check: ticket ${TICKET}"
            echo
            echo "$headline"
            if [ -f test-output.txt ]; then
              echo
              echo "<details><summary>Test summary</summary>"
              echo
              echo '```'
              grep -E "PASSED|FAILED|ERROR|passed|failed" test-output.txt | tail -n 20
              echo '```'
              echo
              echo "</details>"
            fi
            echo
            echo "Full output and service logs: [workflow run](${RUN_URL})."
          } > comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment.md

      - name: Fail the check if tests did not pass
        if: steps.result.outputs.value != 'passed'
        env:
          RESULT: ${{ steps.result.outputs.value }}
        run: |
          echo "::error::Result: $RESULT"
          exit 1

  # The PR author replied in the PR. Only the author's own comments start this
  # job (payload fields, no API call); threads.py then checks that a review is
  # open and that the last comment is the author's answer (D28, D29).
  # The student's code is checked out but never built or run here.
  answer:
    if: >-
      github.event_name == 'issue_comment'
      && github.event.action == 'created'
      && github.event.issue.pull_request
      && github.event.comment.user.login == github.event.issue.user.login
      && github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: codementor-${{ github.repository }}-answer-${{ github.event.issue.number }}
      cancel-in-progress: false  # answer the comments one by one, in order

    steps:
      - name: Check out platform
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.platform_repo }}
          ref: ${{ inputs.platform_ref }}
          path: codementor

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read the review thread
        id: thread
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" > pr-comments.json
          (cd codementor && python -m agent.threads --comments ../pr-comments.json --author "$AUTHOR") \
            | tee -a "$GITHUB_OUTPUT"

      - name: Check out the PR head
        if: steps.thread.outputs.action == 'run'
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          path: student
          fetch-depth: 0

      # Answers count only for the reviewed commit (D27). After a new push the
      # check job posts new questions, so here we just stop.
      - name: Check that the review is for the current code
        id: head
        if: steps.thread.outputs.action == 'run'
        working-directory: student
        env:
          REVIEW_SHA: ${{ steps.thread.outputs.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          head_sha=$(git rev-parse HEAD)
          if [ "$head_sha" != "$REVIEW_SHA" ]; then
            echo "::notice title=CodeMentor::New commits since the review, waiting for the new check."
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"
          git diff "origin/${DEFAULT_BRANCH}...HEAD" > ../changes.diff

      - name: Run the mentor agent (answer mode)
        id: agent
        if: steps.head.outputs.current == 'true'
        continue-on-error: true
        working-directory: codementor
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CODEMENTOR_MODEL: ${{ vars.CODEMENTOR_MODEL }}
          TICKET: ${{ steps.thread.outputs.ticket }}
          AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          pip install -r agent/requirements.txt
          python -m agent.main --mode answer --ticket "$TICKET" --repo ../student \
            --diff ../changes.diff --comments ../pr-comments.json --author "$AUTHOR" \
            --out ../comment.md --verdict-out ../verdict.txt --trace ../agent-trace.json

      - name: Upload the answer run
        if: always() && steps.head.outputs.current == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: codementor-answer
          path: |
            changes.diff
            agent-trace.json
          if-no-files-found: ignore

      # The workflow, not the agent, posts the comment and adds the label.
      # Adding a label through the issues API creates it if it does not exist.
      - name: Comment and label
        if: steps.head.outputs.current == 'true'
        env:
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          TICKET: ${{ steps.thread.outputs.ticket }}
        run: |
          if [ "$AGENT_OUTCOME" = "success" ] && [ -s comment.md ]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment.md
            if [ "$(cat verdict.txt)" = "done" ]; then
              gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" \
                -f "labels[]=ticket-${TICKET}-done" > /dev/null
            fi
            exit 0
          fi
          {
            echo "<!-- codementor:ticket=${TICKET};mode=check;result=answer_failed -->"
            echo "### CodeMentor"
            echo
            echo "The mentor could not process your answer this time. Please post it again in a new comment a bit later."
          } > comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment.md
